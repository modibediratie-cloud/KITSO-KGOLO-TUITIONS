<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term Report | KITSO KGOLO TUITIONS</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f0f2f5; color:#333; padding:1.5rem 1rem; }
        .container { max-width:900px; margin:0 auto; background:white; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); overflow:hidden; }
        .top-bar { background:#1a1a2e; text-align:center; padding:1.2rem; }
        .top-bar img { height:70px; margin-bottom:0.3rem; }
        .panel { padding:2rem; }
        h1 { text-align:center; margin-bottom:1.5rem; color:#0f3460; font-size:1.5rem; }
        label { font-weight:600; display:block; margin-bottom:0.3rem; }
        input, textarea, select { width:100%; padding:0.8rem; border:1px solid #ddd; border-radius:8px; font-family:inherit; font-size:1rem; margin-bottom:1rem; }
        textarea { resize:vertical; min-height:60px; }
        .subject-row { background:#f8f9fa; padding:1rem; border-radius:12px; margin-bottom:1rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-start; }
        .field { flex:1 1 130px; }
        .field.small { flex:0 0 100px; }
        .btn { border:none; padding:0.8rem 1.8rem; border-radius:50px; font-weight:600; cursor:pointer; font-size:0.95rem; transition:all 0.2s; margin:0.25rem; }
        .btn-outline { background:white; border:2px solid #0f3460; color:#0f3460; }
        .btn-outline:hover { background:#f0f5ff; }
        .btn-primary { background:#0f3460; color:white; }
        .btn-primary:hover { background:#1a1a2e; }
        .btn-success { background:#27ae60; color:white; }
        .btn-success:hover { background:#219a52; }
        .btn-danger { background:#e94560; color:white; }
        .btn-danger:hover { background:#c23152; }
        .action-buttons { margin-top:1.5rem; display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; }
        .report-section { display:none; margin-top:1.5rem; padding:2rem; border:1px dashed #ccc; border-radius:16px; background:#fafafa; }
        table { width:100%; border-collapse:collapse; margin:1.5rem 0; }
        th, td { border:1px solid #ccc; padding:0.7rem; text-align:left; vertical-align:top; }
        th { background:#0f3460; color:white; }
        .report-meta { display:flex; justify-content:space-between; margin-bottom:1rem; font-weight:500; }
        .signature-line { margin-top:3rem; display:flex; justify-content:space-between; }
        .signature-line div { border-top:1px solid #333; width:40%; padding-top:0.5rem; text-align:center; }
        @media print {
            body { background:white; padding:0; }
            .container { box-shadow:none; max-width:100%; border-radius:0; }
            .top-bar, .panel { display:none; }
            .report-section { display:block!important; border:none; padding:0; margin:0; background:white; }
            .print-logo { display:block!important; text-align:center; margin-bottom:1rem; }
            .print-logo img { height:70px; }
        }
        .print-logo { display:none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <img src="KITSO KGOLO TUITIONS.jpeg" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display:none; color:white; font-weight:bold; font-size:1.3rem;">KITSO KGOLO TUITIONS</div>
        </div>

        <nav style="background:#0f3460; padding:0.6rem 2rem; text-align:center; display:flex; justify-content:center; gap:2rem; flex-wrap:wrap;">
            <a href="weekly.html" style="color:white; text-decoration:none; font-weight:600; font-size:1rem; padding:0.3rem 0;">📋 Weekly</a>
            <a href="monthly.html" style="color:white; text-decoration:none; font-weight:600; font-size:1rem; padding:0.3rem 0;">📆 Monthly</a>
            <a href="reports.html" style="color:white; text-decoration:none; font-weight:600; font-size:1rem; padding:0.3rem 0;">📚 Term</a>
        </nav>

        <div class="panel">
            <h1>📚 Term Student Report</h1>
            <div id="termForm">
                <label for="termStudentName">Student Name</label>
                <input type="text" id="termStudentName" placeholder="Full name">
                <label for="termName">Term</label>
                <select id="termName">
                    <option value="Term 1">Term 1</option>
                    <option value="Term 2">Term 2</option>
                    <option value="Term 3">Term 3</option>
                </select>
                <p style="font-size:0.85rem; color:#555;">Monthly results for the term (3 months).</p>
                <div id="termSubjects"></div>
                <button class="btn btn-outline" id="addTermSubjectBtn">+ Add Subject</button>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="generateTermBtn">Generate Term Report</button>
                </div>
            </div>
            <div class="report-section" id="termReportSection">
                <div class="print-logo"><img src="KITSO KGOLO TUITIONS.jpeg" alt="Logo"></div>
                <div id="termReportContent"></div>
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="window.print()">🖨️ Print / Save as PDF</button>
                    <button class="btn btn-outline" id="backTermBtn">← Edit</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const termSubjectsDiv=document.getElementById('termSubjects');
        function createTermRow(){
            const row=document.createElement('div');
            row.className='subject-row';
            row.innerHTML=`
                <div class="field"><label>Subject</label><input type="text" class="sub-name" placeholder="Subject"></div>
                <div class="field small"><label>Month 1</label><input type="text" class="m1" placeholder="Result"></div>
                <div class="field small"><label>Month 2</label><input type="text" class="m2" placeholder="Result"></div>
                <div class="field small"><label>Month 3</label><input type="text" class="m3" placeholder="Result"></div>
                <div class="field"><label>Term Result</label><input type="text" class="term-result" placeholder="Overall"></div>
                <div class="field"><label>Recommend</label><textarea class="rec" rows="2" placeholder="Next term"></textarea></div>
                <button type="button" class="btn btn-danger remove-row">✕</button>`;
            row.querySelector('.remove-row').addEventListener('click',()=>{
                if(termSubjectsDiv.children.length>1)row.remove();else alert('Need at least one subject.');
            });
            return row;
        }
        termSubjectsDiv.appendChild(createTermRow());
        document.getElementById('addTermSubjectBtn').addEventListener('click',()=>termSubjectsDiv.appendChild(createTermRow()));
        document.getElementById('generateTermBtn').addEventListener('click',()=>{
            const name=document.getElementById('termStudentName').value.trim();
            const term=document.getElementById('termName').value;
            if(!name){alert('Enter student name');return;}
            const rows=document.querySelectorAll('#termSubjects .subject-row');
            const subjects=[]; let valid=true;
            rows.forEach(r=>{
                const n=r.querySelector('.sub-name').value.trim();
                if(!n){alert('All subjects need a name.');valid=false;return;}
                subjects.push({name:n,
                    months:[r.querySelector('.m1').value.trim(),r.querySelector('.m2').value.trim(),r.querySelector('.m3').value.trim()],
                    termResult:r.querySelector('.term-result').value.trim(),
                    rec:r.querySelector('.rec').value.trim()});
            });
            if(!valid)return;
            const esc=s=>String(s).replace(/</g,'&lt;');
            document.getElementById('termReportContent').innerHTML=`
                <div class="report-meta"><span><strong>Student:</strong> ${esc(name)}</span><span><strong>${term}</strong></span></div>
                <table><thead><tr><th>Subject</th><th>Month 1</th><th>Month 2</th><th>Month 3</th><th>Term Result</th><th>Recommendations</th></tr></thead>
                <tbody>${subjects.map(s=>`<tr><td>${esc(s.name)}</td>${s.months.map(m=>`<td>${esc(m)||'—'}</td>`).join('')}<td>${esc(s.termResult)||'—'}</td><td>${esc(s.rec)||'—'}</td></tr>`).join('')}</tbody></table>
                <div class="signature-line"><div>Teacher</div><div>Parent</div></div>`;
            document.getElementById('termForm').style.display='none';
            document.getElementById('termReportSection').style.display='block';
        });
        document.getElementById('backTermBtn').addEventListener('click',()=>{
            document.getElementById('termForm').style.display='block';
            document.getElementById('termReportSection').style.display='none';
        });
    </script>
</body>
</html>
